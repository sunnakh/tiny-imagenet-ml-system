name: tiny-imagenet-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/project/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus:/etc/prometheus/project:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:12.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  alertmanager:
    image: prom/alertmanager:v0.30.0
    command:
      - --config.file=/etc/alertmanager/project.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:19093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/project.yml:ro
      - alertmanager-data:/alertmanager
  webhook:
    image: python:3.12-slim
    command: ["python", "-u", "/app/webhook.py"]
    volumes:
      - ./webhook.py:/app/webhook.py:ro

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
