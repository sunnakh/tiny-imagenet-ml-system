name: Project checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv
      - run: uv pip install --index https://download.pytorch.org/whl/cpu "torch>=2.7,<3"
      - run: uv pip install -e '.[dev]'
      - run: make check
